[package]
name = "gutter"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Render a child terminal program inside a narrower column band while it behaves as if it owns the full terminal."
repository = "https://github.com/stuartc/gutter"
readme = "README.md"
publish = false

[package.metadata.release]
publish = false
allow-branch = ["main"]
# Write the changelog section and stage it: cargo-release only auto-stages Cargo.toml
# and pre-release-replacements, so a hook-written file must be `git add`ed by the hook
# itself. The script prepends rather than regenerating — see its header for why.
pre-release-hook = ["bash", "scripts/changelog.sh"]

[dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"
# Raw mode, terminal size and the cursor/clear/alt-screen escapes only. The
# `events` feature (and the mio / signal-hook 0.3 / signal-hook-mio tree behind
# it) is off: gutter reads the input fd itself (ADR-020). parking_lot stays —
# crossterm depends on it unconditionally.
crossterm = { version = "0.29.0", default-features = false }
signal-hook = "0.4.4"
# Raw waitpid(WUNTRACED|WCONTINUED) and kill(2) for the suspend/resume cycle
# (ADR-0018/0019). Already in the tree transitively via crossterm/portable-pty.
libc = "0.2"
# The same width model vt100 itself uses (its own `unicode-width` dependency), so
# the row-clip column tracker agrees with vt100 cell-for-cell on wide glyphs.
unicode-width = "0.2"

# The wezterm-term comparison oracle (ADR-001) is an OPTIONAL dependency,
# enabled only by the `oracle` feature below. With the feature off (the default)
# it is not compiled or linked, so it stays out of the shipping binary; the
# day-1 equivalence gate (slice 08) is then a flag flip, not a fresh integration.
tattoy-wezterm-term = { version = "0.1.0-fork.5", optional = true }

[dev-dependencies]
expectrl = "0.9.0"
insta = "1.48.0"
proptest = "1.11.0"

[features]
# Wires in the wezterm-term comparison oracle. Off by default; the oracle module
# and its tests are `#[cfg(feature = "oracle")]`, so a normal build never pulls
# the heavy wezterm dependency tree.
oracle = ["dep:tattoy-wezterm-term"]

[profile.release]
strip = true
lto = true
codegen-units = 1

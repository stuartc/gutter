name: CI

on:
  push:
  pull_request:

env:
  # The PTY integration tests resolve terminfo for the spawned child; give them a
  # terminal type that exists on the runner so they don't fall back or error.
  TERM: xterm-256color
  CARGO_TERM_COLOR: always

jobs:
  build-test-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

      - name: cargo test --features oracle
        run: cargo test --features oracle

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets

      - name: cargo clippy --all-targets --features oracle
        run: cargo clippy --all-targets --features oracle
